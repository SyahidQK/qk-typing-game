<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Great Keyboard Showdown: host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Permanent+Marker&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="host">
  <header class="topbar">
    <span class="brand">Ecopia<b>Wellness</b><i>2026</i> <small>host</small></span>
    <span class="conn" id="conn" hidden>Reconnecting…</span>
    <button type="button" class="ghost ghost-warn" id="reset-btn" hidden>Reset game</button>
    <button type="button" class="ghost" id="effects"></button>
    <button type="button" class="ghost" id="mute"></button>
  </header>

  <main>
    <!-- Sign in -->
    <section class="screen stage" id="s-login" data-rain hidden>
      <h1 class="hero hero-sm">Host sign-in</h1>
      <form class="card form" id="login-form" novalidate>
        <label for="pw">Host password</label>
        <input class="field" id="pw" type="password" autocomplete="current-password" aria-describedby="login-err" data-autofocus>
        <p class="err" id="login-err" role="alert"></p>
        <button class="key key-sun" type="submit">Sign in</button>
      </form>
    </section>

    <!-- No game yet -->
    <section class="screen stage" id="s-create" data-rain hidden>
      <div class="showdown">
        <h1 class="showdown-title">
          <span class="sd-1">The Great
            <svg class="showdown-crown" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 30 L4 12 L14 21 L20 7 L26 21 L36 12 L35 30 Z"/><path d="M8 36 H32"/></svg>
          </span>
          <span class="sd-2 brush">Keyboard</span>
          <span class="sd-3">Showdown!</span>
        </h1>
        <p class="tagline">Your skills. Your chance.</p>
      </div>
      <p class="lede">Open a game to get a PIN for the big screen.</p>
      <button class="key key-sun key-lg" type="button" id="create-btn" data-autofocus>Open a game</button>
    </section>

    <!-- Lobby -->
    <section class="screen host-lobby" id="s-lobby" hidden>
      <div class="join-panel">
        <p class="join-url">Join at <b id="join-url"></b></p>
        <p class="join-label">Game PIN</p>
        <div class="pin-caps pin-big" id="pin-big" aria-live="polite"></div>
      </div>
      <div class="roster">
        <div class="roster-head">
          <h2 id="roster-count"></h2>
          <div class="roster-actions">
            <button class="link" type="button" id="force-btn">Start without waiting</button>
            <button class="key key-sun key-lg" type="button" id="start-btn" data-autofocus>Start round 1</button>
          </div>
        </div>
        <ul class="slots" id="slots"></ul>
        <p class="err" id="lobby-err" role="alert"></p>
        <details class="texts" id="texts">
          <summary>Round texts</summary>
          <form id="texts-form">
            <div id="texts-fields"></div>
            <div class="texts-actions">
              <button class="key" type="submit">Save texts</button>
              <span class="saved" id="texts-msg" role="status"></span>
            </div>
          </form>
        </details>
      </div>
    </section>

    <!-- Race -->
    <section class="screen host-race" id="s-race" hidden>
      <div class="hud">
        <div class="hud-item"><span>Round</span><b id="hud-round"></b></div>
        <div class="hud-item"><span>Time</span><b id="hud-time">0:00.0</b></div>
        <div class="hud-item"><span>Finished</span><b id="hud-done"></b></div>
        <button class="key hud-end" type="button" id="end-btn">End round now</button>
      </div>
      <div class="track track-big" id="track"></div>
    </section>

    <!-- Round results -->
    <section class="screen stage wide" id="s-results" hidden>
      <p class="eyebrow" id="res-eyebrow"></p>
      <h1 class="hero hero-sm" id="res-title"></h1>
      <div class="lb" id="res-lb"></div>
      <div class="actions">
        <button class="key key-sun key-lg" type="button" id="next-btn" data-autofocus></button>
        <button class="link" type="button" id="redo-btn"></button>
      </div>
    </section>

    <!-- Final -->
    <section class="screen stage wide" id="s-final" hidden>
      <p class="eyebrow">Final standings</p>
      <h1 class="hero hero-sm" id="fin-title">And the winners are…</h1>
      <div class="podium" id="podium"></div>
      <div class="lb" id="fin-lb" hidden></div>
      <div class="actions" id="final-actions" hidden>
        <button class="key" type="button" id="new-btn">Open a new game</button>
        <button class="link" type="button" id="redo-final-btn"></button>
      </div>
    </section>
  </main>

  <p class="credit">made by Syahid</p>

  <div class="countdown" id="countdown" hidden><div class="cd-num"></div></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/admin.js"></script>
  <script type="module" src="/js/rain.js"></script>
</body>
</html>
